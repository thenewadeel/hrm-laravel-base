name: CI - Lint, Build & Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read

jobs:
  # STRICT gate for deploy: code style + composer validity must pass.
  lint:
    name: Lint (composer validate + Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, iconv, imagick, intl, libxml, mbstring, mysql, pcntl, pdo, pdo_mysql, pdo_sqlite, soap, sqlite3, zip
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Validate composer.json + lock
        run: composer validate --no-check-publish

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies (incl. dev)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ansi

      - name: Laravel Pint (code style)
        run: vendor/bin/pint --test

  # DEPLOY-BLOCKING gate — full unit + feature suite (sqlite :memory:).
  test:
    name: PHP ${{ matrix.php }} — Tests
    runs-on: ubuntu-latest
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, exif, fileinfo, gd, iconv, imagick, intl, libxml, mbstring, mysql, pcntl, pdo, pdo_mysql, pdo_sqlite, soap, sqlite3, zip
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies (incl. dev)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ansi

      - name: Generate application key
        run: php artisan key:generate --force

      # Views use @vite, so assets must exist before the suite can render pages.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Run test suite (sqlite :memory:, unit + feature)
        run: php artisan test --no-coverage

  # STRICT gate for deploy: production frontend assets must build.
  frontend:
    name: Node — Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build