name: Deploy to AlmaLinux VPS (Blue/Green)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate = lint + build (strict in ci.yml). The full test suite is
  # non-blocking (continue-on-error) until the known-red tests are fixed.
  ci-gate:
    name: CI gate (lint + build)
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ ci-gate ]
    secrets: inherit

    steps:
      - name: Run blue/green deploy sequence on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail

            # ---- scratch copy of the orchestration scripts on the box ----
            SCRATCH=/opt/hrm/deploy
            APP_USER=nginx
            APP_URL=https://${{ secrets.DEPLOY_HOST }}

            # git config is already set by the first-time setup; ensure remote repo available
            if [ ! -d "$SCRATCH/.git" ]; then
              sudo mkdir -p "$SCRATCH"
              sudo chown "$APP_USER" "$SCRATCH"
              git clone -b main https://github.com/${{ github.repository }}.git "$SCRATCH"
            fi
            sudo -u "$APP_USER" git -C "$SCRATCH" fetch --depth 1 origin main
            sudo -u "$APP_USER" git -C "$SCRATCH" checkout -B main origin/main

            cd "$SCRATCH"

            # ---- the zero-downtime sequence ----
            APP_USER=$APP_USER \
            GREEN_HEALTH_URL=$APP_URL \
              ./scripts/deploy-bluegreen.sh prepare main

            APP_USER=$APP_USER \
              ./scripts/deploy-bluegreen.sh migrate

            APP_USER=$APP_USER \
            GREEN_HEALTH_URL=$APP_URL \
              ./scripts/deploy-bluegreen.sh healthcheck

            APP_USER=$APP_USER \
              ./scripts/deploy-bluegreen.sh swap

            APP_USER=$APP_USER \
              ./scripts/deploy-bluegreen.sh smoke

            # ---- restart queued workers against the new release ----
            sudo systemctl restart hrm-queue-worker
            sudo systemctl is-active hrm-queue-worker

            # ---- final health probe ----
            APP_URL=$APP_URL ./scripts/health-check-probe.sh || exit 1